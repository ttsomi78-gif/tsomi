# Production stack for the DigitalOcean VPS.
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# `--env-file .env.production` makes the ${...} interpolation below read that
# file, and the same file is injected into the web container via `env_file`.
# See .env.production.example for every required variable.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-tsomi}
    volumes:
      - tsomi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tsomi} -d ${POSTGRES_DB:-tsomi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies ./drizzle SQL migrations, then exits. `web` waits for it.
  migrate:
    build:
      context: .
      target: builder
    command: npx drizzle-kit migrate
    environment:
      DIRECT_URL: postgres://${POSTGRES_USER:-tsomi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tsomi}
      # also set for one-off tooling, e.g. `run --rm migrate npx tsx scripts/seed.ts`
      DATABASE_URL: postgres://${POSTGRES_USER:-tsomi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tsomi}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
    restart: unless-stopped
    # Bound to loopback, not 0.0.0.0: the only public way in is Caddy on 443.
    # Keeping the port lets you curl it over an SSH tunnel when debugging.
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tsomi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tsomi}
      UPLOADS_DIR: /app/uploads
    volumes:
      # Product photos. Has to be a volume, not a path inside the image —
      # `public/` is baked in at build time and every upload would vanish on
      # the next deploy. Back this up alongside the database.
      - tsomi_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # TLS terminator. Caddy gets and renews Let's Encrypt certificates on its own,
  # which is why ports 80 and 443 must both be free and publicly reachable —
  # the HTTP-01 challenge arrives on 80.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # issued certificates — losing this re-requests them
      - caddy_config:/config
    depends_on:
      - web

volumes:
  tsomi_pgdata:
  tsomi_uploads:
  caddy_data:
  caddy_config:
